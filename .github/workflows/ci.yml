name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests with coverage
        run: >
          pytest -v
          --cov=app
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage XML
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Set up Python (gate scripts use the standard library only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: forge build

      - name: Unit, fuzz and invariant tests (mainnet-fork suite is opt-in)
        run: forge test -vv

      - name: Gas regression gate (2% tolerance)
        run: |
          forge snapshot --snap .gas-snapshot.ci
          python ../scripts/check_gas_baseline.py .gas-snapshot .gas-snapshot.ci --tolerance 2

      - name: Coverage gate (executor branches and lines >= 90%)
        run: sh ../scripts/forge_coverage.sh

      - name: Committed artifact matches the build
        run: python ../scripts/export_executor_artifact.py --check

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t crypto-mm-lab:ci .
